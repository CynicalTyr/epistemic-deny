[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-deny"
version = "0.1.0"
description = "Structured STATUS/WHY/USE_INSTEAD tool denies so LLMs cannot invent success."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CynicalTyr" }]
keywords = ["ai-agents", "llm", "edge"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = []
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/CynicalTyr/epistemic-deny"
Issues = "https://github.com/CynicalTyr/epistemic-deny/issues"

[tool.setuptools]
py-modules = ["epistemic"]
